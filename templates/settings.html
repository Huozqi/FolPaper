{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="cyber-hero p-6 mb-8">
    <div class="relative z-10">
        <div class="text-xs uppercase tracking-[0.35em] text-gray-400 mb-2">Model Control Center</div>
        <h2 class="cyber-title text-4xl font-black">系统设置</h2>
        <p class="text-sm text-gray-500 mt-2">配置模型连接、API 网关和默认推理模型。</p>
    </div>
</div>
    
    <form action="{{ url_for('settings') }}" method="POST" class="cyber-console border rounded-2xl p-8 shadow-sm space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">API Key</label>
            <input type="password" name="api_key" value="{{ config.api_key }}" placeholder="sk-..." class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <p class="text-xs text-gray-500 mt-2">用于访问大模型翻译接口的密钥。</p>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Base URL</label>
            <input type="text" name="base_url" value="{{ config.base_url }}" placeholder="https://api.openai.com/v1" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <p class="text-xs text-gray-500 mt-2">如果使用代理服务或第三方兼容接口，请修改此项。</p>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Model</label>
            <input type="text" name="model" value="{{ config.model }}" placeholder="gpt-3.5-turbo" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <p class="text-xs text-gray-500 mt-2">翻译时使用的模型名称，如 gpt-3.5-turbo 或 gpt-4。</p>
        </div>
        
        <div class="pt-4 flex space-x-4">
            <button type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium shadow-sm">
                保存设置
            </button>
            <button type="submit" formaction="{{ url_for('test_api') }}" class="flex-1 py-3 bg-gray-100 text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-200 transition font-medium shadow-sm">
                测试连接
            </button>
        </div>
    </form>
</div>
{% endblock %}
